[project]
name = "prototype"
version = "0.1.0"
description = "Compiles approved FIM Stammdatenschemata into application graphs and copilot instructions"
readme = "README.md"
authors = [
    { name = "Lukas Bannenberg", email = "lukasbannenberg@gmail.com" },
    { name = "Paul Schuetz", email = "paulschuetz.mail@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "pypdfium2>=5.12.1",  # PDF text and form-field extraction
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
